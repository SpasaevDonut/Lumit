[package]
name = "lumit_bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

# A cdylib the Flutter desktop runners load over dart:ffi, plus a staticlib for
# the platforms cargokit links statically (iOS, and Android's release builds).
# `rlib` is deliberately absent: flutter_rust_bridge's generated code is only
# ever reached through the C ABI, and cargo still builds the lib separately for
# the in-crate unit tests, so `cargo test -p lumit_bridge` keeps working.
[lib]
crate-type = ["cdylib", "staticlib"]

# Rendering is NOT a feature. lumit-render, lumit-audio and lumit-eval are
# unconditional dependencies, because the render worker is part of the API
# surface and that surface is deliberately identical whatever is enabled — the
# generated Dart has to be one shape on every platform, so the Viewer holds one
# `switch` over the publish paths rather than a per-build set of them. A bridge
# that cannot draw has no use anyway; this was `render = default` in all but
# name, and a "feature" nothing could turn off was a lie in the manifest.
#
# The `media` feature (default on) genuinely is optional: pulling lumit-media
# means linking FFmpeg, and building without it is a real configuration. Footage
# then does not probe and thumbnails are absent.
[features]
# The two zero-copy Viewer paths stay out of this set: each is single-platform
# (D3D12 on Windows, Vulkan/DMA-BUF on Linux) and the comments below record them
# as opt-in, so having them on by default would both contradict that and put
# platform-specific code in every gate. Enable one explicitly for a dev build,
# e.g. `--features shared-texture-linux` on Linux.
default = ["media"]
media = ["dep:lumit-media"]
# The Windows zero-copy Viewer path (K-177). OFF by default so the standard
# build and every gate stay identical to today; the owner builds the shipped
# `.dll` with `--features shared-texture` to turn it on. It implies `render`
# (the compositor) and forwards to lumit-render's own `shared-texture` feature,
# which pins the D3D12 backend and pulls the shared-texture GPU code. The actual
# D3D interop is `cfg(windows)`-gated on top, so enabling it off Windows is
# inert. `lumit_bridge_shared_supported()` reports whether this build has it.
shared-texture = ["lumit-render/shared-texture"]
# The Linux zero-copy Viewer path (K-177), the DMA-BUF sibling of
# `shared-texture`. OFF by default so the standard build and every gate stay
# identical to today; the owner builds the shipped Linux `.so` with
# `--features shared-texture-linux`. It implies `render` and forwards to
# lumit-render's own `shared-texture-linux` feature (the Vulkan/DMA-BUF code).
# The Vulkan interop is `cfg(target_os = "linux")`-gated on top, so enabling it
# off Linux is inert.
shared-texture-linux = ["lumit-render/shared-texture-linux"]

[dependencies]
lumit-core = { path = "../lumit-core" }
lumit-project = { path = "../lumit-project" }
# The realtime preview-tier controller (K-030/K-171) lives here as a pure,
# tested decision core; the bridge feeds it measured render costs and reads the
# tier back (see src/realtime.rs). An engine crate, so the docs/05 layering
# (engine crates never depend on the UI) is unbroken.
lumit-eval = { path = "../lumit-eval" }
lumit-media = { path = "../lumit-media", optional = true }
# Beat detection maths (docs/09 §5); the audio mixdown rides the same
# headless input path lumit-render provides.
lumit-audio = { path = "../lumit-audio" }
# The pixel pass (K-178): the headless renderer, the decode worker, the draw
# builder and the compositor the Viewer and export both drive. An engine crate,
# so the bridge depends on no frontend.
lumit-render = { path = "../lumit-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }

[dev-dependencies]
tempfile = "3"

# The bridge is the one crate that cannot inherit the workspace's
# `unsafe_code = "deny"`: flutter_rust_bridge's generated glue crosses a C ABI
# over raw pointers, which is unsafe by construction. The clippy denies from the
# workspace are kept, so no-panic/no-unwrap discipline still holds here.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_code = "allow"

unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
