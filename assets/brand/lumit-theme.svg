<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- File-type icon, .lumtheme (docs/15-DESIGN.md, brand; K-251, K-298).
       The page and its folded corner are the family's; the glyph is three
       overlapping swatches rather than the keyframe mark, because what this
       file carries is colours. Three, and large, so the shape still reads as
       swatches at 16 pixels where the label is a smudge.

       **The three overlap in a ring, not a stack**: blue over white, violet
       over blue, white over violet. No painting order can produce a cycle, so
       the white swatch is painted twice — once under the other two, and once
       more over the violet one.

       **Every rim is drawn exactly once**, and only where its own swatch is the
       one in front. Two rims at a quarter opacity stacking is what turns a
       crossing into a dark blot; a rim left under the swatch in front of it is
       what puts a grey line across that swatch; and one rim drawn as two arcs
       meeting end to end leaves a seam where their softened ends meet. So each
       swatch paints its fill before its own rim, covering the rim of whatever it
       is in front of, and the white swatch — which is painted twice — takes its
       rim last, in one piece, clipped to where it is not behind the blue one.

       The second white's fill reaches a hair past the violet circle: clipped to
       exactly the same circle, the violet swatch's own softened edge pixels show
       through the join as a hairline. -->
  <defs>
    <linearGradient id="key-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86e2ff"/><stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <linearGradient id="key-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a70ff"/><stop offset="1" stop-color="#ff4f9e"/>
    </linearGradient>
    <linearGradient id="key-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8dcf2"/>
    </linearGradient>
    <filter id="key-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#04060b" flood-opacity="0.4"/>
    </filter>
    <clipPath id="sw-blue"><circle cx="214" cy="206" r="62"/></clipPath>
    <clipPath id="sw-violet"><circle cx="298" cy="206" r="62"/></clipPath>
    <clipPath id="sw-white"><circle cx="256" cy="278" r="62"/></clipPath>
    <!-- The violet swatch grown by a hair, for the second white's fill. -->
    <clipPath id="sw-violet-over"><circle cx="298" cy="206" r="63.5"/></clipPath>
    <!-- Everything but the blue swatch, likewise grown: where the white swatch
         is in front, and so where its rim belongs. -->
    <clipPath id="sw-outside-blue">
      <path d="M0 0 H512 V512 H0 Z M150.5 206 a63.5 63.5 0 1 0 127 0 a63.5 63.5 0 1 0 -127 0 Z"
            clip-rule="evenodd"/>
    </clipPath>
    <linearGradient id="doc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b21"/><stop offset="1" stop-color="#101217"/>
    </linearGradient>
  </defs>
  <path d="M116 92 Q116 64 144 64 L318 64 L396 142 L396 420 Q396 448 368 448 L144 448 Q116 448 116 420 Z"
        fill="url(#doc-bg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M318 64 L396 142 L332 142 Q318 142 318 128 Z" fill="#272b34"/>
  <g filter="url(#key-shadow)"
     transform="translate(256 234) scale(0.88) translate(-256 -234)">
    <!-- White, under everything. Its rim comes last, in one piece. -->
    <circle cx="256" cy="278" r="62" fill="url(#key-c)"/>
    <!-- Blue over white. -->
    <g clip-path="url(#sw-blue)">
      <circle cx="214" cy="206" r="62" fill="url(#key-a)"/>
      <circle cx="214" cy="206" r="62" fill="none"
              stroke="#0c0e14" stroke-opacity="0.25" stroke-width="10"/>
    </g>
    <!-- Violet over blue. -->
    <g clip-path="url(#sw-violet)">
      <circle cx="298" cy="206" r="62" fill="url(#key-b)"/>
      <circle cx="298" cy="206" r="62" fill="none"
              stroke="#0c0e14" stroke-opacity="0.25" stroke-width="10"/>
    </g>
    <!-- White again, over violet: the ring closes. -->
    <g clip-path="url(#sw-white)">
      <g clip-path="url(#sw-violet-over)">
        <circle cx="256" cy="278" r="62" fill="url(#key-c)"/>
      </g>
    </g>
    <!-- The white swatch's rim, drawn once and last, wherever the white swatch
         is the one in front. Once, because two arcs meeting end to end leave a
         seam across the rim where their softened ends meet. -->
    <g clip-path="url(#sw-white)">
      <g clip-path="url(#sw-outside-blue)">
        <circle cx="256" cy="278" r="62" fill="none"
                stroke="#0c0e14" stroke-opacity="0.25" stroke-width="10"/>
      </g>
    </g>
  </g>
  <text x="256" y="408" font-family="JetBrains Mono, Consolas, monospace" font-size="58"
        font-weight="700" letter-spacing="6" fill="#aab6c6" text-anchor="middle">THEME</text>
</svg>
