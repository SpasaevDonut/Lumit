<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none">
  <!-- Layer 3: left key square (cyan to blue), rotated 45 degrees.
       No rim stroke: the flat icon draws one to imply a lit edge, and Liquid
       Glass bevels and lights the layer itself. -->
  <defs>
    <linearGradient id="key-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86e2ff"/><stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <g transform="rotate(45 180 256)">
      <rect x="77.5" y="153.5" width="205" height="205" rx="36" fill="url(#key-a)"/>
    </g>
  </g>
</svg>
